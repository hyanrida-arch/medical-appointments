[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "nginx"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=DoctorsSeeder --force && php artisan storage:link && php -S 0.0.0.0:$PORT -t public"